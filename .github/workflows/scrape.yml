name: Scrape

on:
  push:
  workflow_dispatch:
  schedule:
  # Daily at 6:23 AM UTC
  - cron: '23 6 * * *'
  # For hourly at 42 minutes past the hour: '42 * * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !github.event.repository.is_template }}
    steps:
    # The runner's disk is slow the first time a file is read, which can make
    # Chrome take ~10s to start. Read Chrome (and the libraries it loads) in
    # the background now so that happens while checkout and pip install run.
    - name: Warm up Chrome
      run: |
        nohup sh -c '
          find /opt/google/chrome -type f -exec cat {} + >/dev/null 2>&1
          timeout 30 google-chrome --headless --disable-gpu --dump-dom about:blank >/dev/null 2>&1
        ' >/dev/null 2>&1 &
    - uses: actions/checkout@v7
    - name: Create scrape.sh if it doesn't exist
      run: |
        if [ ! -f "scrape.sh" ]; then
          echo '#!/bin/bash' > scrape.sh
          if [[ "$REPO_DESC" == http://* ]] || [[ "$REPO_DESC" == https://* ]]; then
            echo "./download.sh '$REPO_DESC'" >> scrape.sh
          else
            echo "# ./download.sh 'https://www.example.com/'" >> scrape.sh
          fi
          chmod +x scrape.sh
          echo "Created scrape.sh"
          # And replace README.md
          echo -e "# Scheduled scraper\n\nFor $REPO_DESC" > README.md 
        fi
      env:
        REPO_DESC: ${{ github.event.repository.description }}
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: "pip"
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    - name: Install Chrome and Xvfb
      run: |
        # Both are normally pre-installed on ubuntu-latest, so only touch apt
        # if one of them is actually missing.
        need_update=1
        apt_install() {
          if [ -n "$need_update" ]; then sudo apt-get update; need_update=; fi
          sudo apt-get install -y "$@"
        }
        command -v xvfb-run >/dev/null 2>&1 || apt_install xvfb
        if ! command -v google-chrome >/dev/null 2>&1; then
          apt_install chromium-browser || apt_install chromium
        fi
        CHROME_PATH=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)
        echo "Resolved CHROME_PATH=$CHROME_PATH"
        "$CHROME_PATH" --version || true
        echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
    - name: Run the scraper
      run: |
        ./scrape.sh
    - name: Upload debug pages
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: debug-pages
        path: debug/
        if-no-files-found: ignore
    - name: Commit and push
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "${timestamp}" || exit 0
        git pull --rebase
        git push
